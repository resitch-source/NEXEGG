<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10231F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEXEGG Egg Distribution</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#ECEEF1;--surface:#fff;--surface2:#F5F6F8;--ink:#1B2430;--muted:#5C6877;--line:#D6DBE2;
  --brand:#17695A;--brand-ink:#fff;--side:#10231F;--side-ink:#C9D6D2;
  --yolk:#F6B51E;--yolk-ink:#35270A;--red:#BA3A2A;--blue:#2C5C9A;--ok:#1D7A52;--warn:#A86A00;
  --r:10px;--r-sm:6px;--shadow:0 1px 2px rgba(16,35,31,.08),0 6px 20px rgba(16,35,31,.06);
  --fh:"Avenir Next Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
:root[data-theme=dark]{
  --bg:#11161B;--surface:#1A2129;--surface2:#212A34;--ink:#E7EBF0;--muted:#98A4B3;--line:#2D3843;
  --brand:#3FA892;--brand-ink:#06201A;--side:#0B1512;--side-ink:#B5C4BF;--red:#E26A58;--blue:#7FA9E0;--ok:#55C08F;--warn:#E3A93B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--fh);margin:0;letter-spacing:.01em;line-height:1.15}
h1{font-size:1.7rem;font-weight:700}h2{font-size:1.3rem;font-weight:700}h3{font-size:1.08rem;font-weight:600}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:.86rem}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g2w{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}.g2n{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}
/* shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px}
.brand img,.brand svg{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none}
.brand b{font-family:var(--fh);font-size:1.25rem;color:#fff;display:block;line-height:1}
.brand span{font-size:.75rem;opacity:.75}
#nav{padding:6px 8px 20px;flex:1}
#nav .sec{font-size:.74rem;opacity:.6;padding:14px 10px 4px}
#nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;color:inherit;text-decoration:none;border-left:3px solid transparent}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav a.on{background:rgba(246,181,30,.13);color:#fff;border-left-color:var(--yolk)}
#nav a svg{width:18px;height:18px;flex:none}
#nav a .badge{margin-left:auto}
#main{min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top h1{font-size:1.35rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{padding:18px 20px 90px;max-width:1500px;width:100%}
#tabs{display:none}
.ib{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--surface2)}.ib svg{width:19px;height:19px}
.dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.sync-ok .dot{background:var(--ok)}.sync-pend .dot{background:var(--yolk)}.sync-off .dot{background:var(--muted)}
/* controls */
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;min-height:38px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--yolk);border-color:#D99A06;color:var(--yolk-ink)}.btn.pri:hover{background:#FFC53A}
.btn.grn{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.dan{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.sm{padding:4px 9px;min-height:30px;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--brand);flex:none}
input[type=color]{padding:2px;width:52px}
label.f{display:block;font-size:.84rem;color:var(--muted);font-weight:600}
label.f>input,label.f>select,label.f>textarea,label.f>.inp{margin-top:4px;color:var(--ink);font-weight:400;font-size:.95rem}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);font-size:.93rem}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.form .full{grid-column:1/-1}
.err{color:var(--red);font-size:.86rem}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:10px;width:18px;height:18px;color:var(--muted)}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card>h3{margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel>.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel>.pb{padding:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;border-top:3px solid var(--line)}
.kpi b{display:block;font-family:var(--fh);font-size:1.75rem;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:.86rem;color:var(--muted)}
.kpi.y{border-top-color:var(--yolk)}.kpi.g{border-top-color:var(--brand)}.kpi.r{border-top-color:var(--red)}.kpi.b{border-top-color:var(--blue)}
.kpi small{display:block;font-size:.8rem;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--red)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.badge.g{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--surface));color:var(--ok)}
.badge.y{background:color-mix(in srgb,var(--yolk) 22%,var(--surface));border-color:color-mix(in srgb,var(--yolk) 60%,var(--surface));color:var(--warn)}
.badge.r{background:color-mix(in srgb,var(--red) 13%,var(--surface));border-color:color-mix(in srgb,var(--red) 40%,var(--surface));color:var(--red)}
.badge.b{background:color-mix(in srgb,var(--blue) 13%,var(--surface));border-color:color-mix(in srgb,var(--blue) 40%,var(--surface));color:var(--blue)}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabsbar button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabsbar button.on{color:var(--ink);border-bottom-color:var(--yolk)}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.83rem;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2);cursor:default}
.t th[data-sort]{cursor:pointer}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:var(--surface2)}
.t td.act{white-space:nowrap;text-align:right}
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--surface2);border:1px solid var(--line);display:block}
.thumb.lg{width:96px;height:96px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);font-size:.88rem}
/* egg tray gauge: the signature */
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:7px;background:#C9BFA9;border-radius:9px;width:118px;flex:none;background-image:linear-gradient(135deg,#D3C9B3,#BDB29B)}
.tray i{aspect-ratio:1;border-radius:50%;background:rgba(60,48,25,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tray i.f{background:radial-gradient(circle at 35% 30%,#fff,#F3E6CF 60%,#DDC9A6);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.tray.low i.f{background:radial-gradient(circle at 35% 30%,#FFE9A8,#F6B51E 70%)}
.tray.out i{background:rgba(186,58,42,.35)}
.traycard{display:flex;gap:13px;align-items:center}
.traycard b{font-family:var(--fh);font-size:1.5rem;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,16,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(1020px,100%)}.modal.narrow{width:min(430px,100%)}
.modal>.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal>.mh h2{flex:1}
.modal>.mb{padding:18px;overflow-y:auto;flex:1}
.modal>.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:300;display:grid;gap:8px;width:min(440px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);font-weight:500}
.toast.bad{background:var(--red);color:#fff}.toast.good{background:var(--ok);color:#fff}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth .pitch{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .pitch h1{font-size:clamp(2.2rem,4.6vw,3.8rem);line-height:1;max-width:11ch}
.auth .pitch p{max-width:44ch;color:var(--side-ink)}
.auth .pitch .tray{width:min(300px,60%);gap:7px;padding:16px;border-radius:18px;margin:30px 0}
.auth .box{padding:40px 28px;display:grid;place-items:center;background:var(--bg)}
.auth .box>div{width:min(390px,100%)}
/* pos + store */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.pc:hover{border-color:var(--yolk)}
.pc img,.pc .ph0{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;background:var(--surface2);display:grid;place-items:center}
.pc .ph0 svg{width:44%;opacity:.5}
.pc b{font-size:.92rem;line-height:1.2}
.pc .pr{font-family:var(--fh);font-size:1.12rem;font-weight:700}
.pc .stk{position:absolute;top:12px;right:12px}
.cart{position:sticky;top:70px}
.cl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:32px;height:32px;cursor:pointer;font-weight:700}
.qty input{border:0;width:58px;text-align:center;min-height:32px;border-radius:0;padding:0}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.big{font-family:var(--fh);font-size:1.5rem;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.store-hd{background:var(--side);color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:30}
.store-hd img{width:44px;height:44px;border-radius:9px;object-fit:cover}
.store-hd .grow{min-width:0}.store-hd .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.store-hd{padding:10px 12px;gap:8px}.store-hd img{width:36px;height:36px}.store-hd .grow b{font-size:1.05rem!important}.store-hd .grow div{display:none}.store-hd .btn{padding:6px 10px;min-height:36px;font-size:.88rem}}
.store-hero{background:var(--side);color:#fff;padding:26px 20px 34px}
.store-hero h1{font-size:clamp(1.9rem,5vw,3rem);max-width:18ch}
.store-body{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.steps{display:flex;gap:0;margin:16px 0}
.steps div{flex:1;text-align:center;font-size:.8rem;color:var(--muted);position:relative;padding-top:24px}
.steps div:before{content:"";position:absolute;top:4px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line);z-index:1}
.steps div:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:3px;background:var(--line)}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--ink);font-weight:600}.steps div.done:before,.steps div.done:after{background:var(--brand)}
/* chat */
#chatfab{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;border-radius:50%;border:0;background:var(--yolk);color:var(--yolk-ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
#chatfab svg{width:26px;height:26px}
#chat{position:fixed;right:18px;bottom:82px;z-index:61;width:min(380px,calc(100vw - 24px));height:min(540px,calc(100vh - 110px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#chat .ch{background:var(--side);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px}
#chat .cb{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:3px}
#chat .cf{display:flex;gap:6px;padding:9px;border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* misc */
.insight{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border:0}
.insight .lv{width:8px;border-radius:4px;flex:none;background:var(--blue)}
.insight.hi .lv{background:var(--red)}.insight.mid .lv{background:var(--yolk)}.insight.ok .lv{background:var(--ok)}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand)}
.imgpick{display:flex;gap:10px;align-items:center}
video.scan{width:100%;border-radius:10px;background:#000;max-height:56vh}
canvas.sig{width:100%;height:150px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none}
.perm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.label-sheet>div{border:1px dashed #999;padding:6px;text-align:center;font-size:11px;background:#fff;color:#000;break-inside:avoid}
code,.code{font-family:ui-monospace,Consolas,monospace;font-size:.86rem;background:var(--surface2);padding:1px 5px;border-radius:4px;word-break:break-all}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:1fr}.cart{position:static}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:260px;z-index:90;transform:translateX(-100%);transition:transform .18s}
  #side.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.5)}
  #top{padding:8px 12px}#view{padding:12px 12px 96px}
  #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  #tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.72rem;color:var(--muted);text-decoration:none;background:none;border:0}
  #tabs a.on{color:var(--ink);font-weight:700}#tabs a svg{width:22px;height:22px}
  #tabs a.scan svg{background:var(--yolk);color:var(--yolk-ink);border-radius:50%;padding:7px;width:40px;height:40px;margin-top:-16px;box-shadow:var(--shadow)}
  #chatfab{bottom:76px;right:12px;width:48px;height:48px}#chat{bottom:132px;right:12px}
  .g2,.g3,.g2w,.g2n{grid-template-columns:1fr}.form{grid-template-columns:1fr}
  .ov{padding:0;place-items:end center}.modal,.modal.wide,.modal.narrow{width:100%;max-height:94vh;border-radius:16px 16px 0 0}
  .auth{grid-template-columns:1fr}.auth .pitch{padding:26px 22px}.auth .pitch .tray{width:150px;margin:14px 0;gap:4px;padding:9px}.auth .box{padding:24px 18px}
  table.t.rsp thead{display:none}
  table.t.rsp,table.t.rsp tbody,table.t.rsp tr,table.t.rsp td{display:block;width:100%}
  table.t.rsp tr{border-bottom:1px solid var(--line);padding:8px 4px}
  table.t.rsp td{border:0;padding:3px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.t.rsp td:before{content:attr(data-l);color:var(--muted);font-size:.82rem;text-align:left;flex:none}
  table.t.rsp td.act{justify-content:flex-end}
  .hide-m{display:none!important}
}

function flat(r){const o={};for(const k in r){if(k==='_s'||k==='_err')continue;const v=r[k];o[k]=v&&typeof v==='object'?JSON.stringify(v):v}return o}
function unflat(r){const o={};for(const k in r){let v=r[k];if(typeof v==='string'&&/^[\[{]/.test(v)){try{v=JSON.parse(v)}catch(e){}}o[k]=v}return o}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function xlsBlob(sheets){await libXLSX();const wb=XLSX.utils.book_new();for(const n in sheets){const ws=XLSX.utils.json_to_sheet(sheets[n].length?sheets[n]:[{}]);XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))}return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
async function xlsExport(name,sheets){saveBlob(await xlsBlob(sheets),`${name}-${today()}.xlsx`)}
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click()})}
async function xlsRead(file){await libXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const o={};for(const n of wb.SheetNames)o[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});return o}
async function importTable(t,natural){const f=await pickFile('.xlsx,.xls,.csv');if(!f)return null;const wb=await xlsRead(f);const rows=wb[t]||Object.values(wb)[0]||[];let n=0;
  for(const raw of rows){const r=unflat(raw);if(!Object.values(r).some(v=>v!==''))continue;delete r._u;delete r._by;delete r._s;
    let ex=r.id?M[t].get(r.id):null;if(!ex&&natural&&r[natural]!=='')ex=DB.all(t).find(x=>String(x[natural])===String(r[natural]));
    if(!r.id)delete r.id;const rec={...(ex||{}),...r};if(ex)rec.id=ex.id;if(rec.active===undefined||rec.active==='')rec.active=true;if(rec.active==='false'||rec.active==='FALSE')rec.active=false;DB.put(t,rec,{silent:true});n++}
  audit('import',t,'',n+' rows');return n}

/* ---------------- charts (dependency-free SVG) ---------------- */
const PAL = ['#17695A','#F6B51E','#2C5C9A','#A6532F','#6B4E9E','#2D8FA3','#7A8594','#C0577F'];
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function lineChart(series,labels,{h=220,fmt=fn,area=true}={}){
  const W=680,L=52,R=12,T=10,B=26,n=labels.length;if(!n)return '<div class="empty">Not enough data yet.</div>';
  const mx=niceMax(Math.max(1,...series.flatMap(s=>s.data.filter(v=>v!=null))));const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>T+(h-T-B)*(1-v/mx);
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  const step=Math.max(1,Math.ceil(n/8));for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${esc(labels[i])}</text>`;
  series.forEach((s,si)=>{const c=s.color||PAL[si%PAL.length];let d='',st=false,pts=[];s.data.forEach((v,i)=>{if(v==null){st=false;return}d+=(st?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);st=true;pts.push(i)});
    if(area&&si===0&&pts.length>1)g+=`<path d="${d}L${x(pts[pts.length-1]).toFixed(1)} ${y(0)}L${x(pts[0]).toFixed(1)} ${y(0)}Z" fill="${c}" opacity=".1"/>`;
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" ${s.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`;
    if(n<=40)s.data.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${c}"><title>${esc(labels[i]+': '+fmt(v))}</title></circle>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>${series.length>1?`<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||PAL[i%PAL.length]}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}
function barChart(items,{fmt=fn,color=PAL[0],max=12}={}){items=items.slice(0,max);if(!items.length)return '<div class="empty">Not enough data yet.</div>';const mx=Math.max(1,...items.map(i=>Math.abs(i.value)));
  return `<div style="display:grid;gap:7px">${items.map(i=>`<div style="display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:10px;align-items:center;font-size:.9rem"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.label)}">${esc(i.label)}</span><div class="bar" style="height:14px"><i style="width:${Math.max(1,Math.abs(i.value)/mx*100).toFixed(1)}%;background:${i.color||color}"></i></div><span class="num">${esc(fmt(i.value))}</span></div>`).join('')}</div>`}
function colChart(items,{h=200,fmt=fn,color=PAL[0]}={}){if(!items.length)return '<div class="empty">Not enough data yet.</div>';const W=680,L=52,R=8,T=10,B=26,n=items.length;const mx=niceMax(Math.max(1,...items.map(i=>i.value)));const bw=(W-L-R)/n;const y=v=>T+(h-T-B)*(1-v/mx);let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  const step=Math.max(1,Math.ceil(n/10));items.forEach((it,i)=>{g+=`<rect x="${L+i*bw+bw*.14}" y="${y(Math.max(0,it.value))}" width="${bw*.72}" height="${Math.max(0,y(0)-y(Math.max(0,it.value)))}" rx="2" fill="${it.color||color}"><title>${esc(it.label+': '+fmt(it.value))}</title></rect>`;if(i%step===0)g+=`<text x="${L+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(String(it.label).slice(0,12))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`}
function donut(items,{fmt=fn}={}){const tot=sum(items,i=>i.value);if(tot<=0)return '<div class="empty">Not enough data yet.</div>';let a=-Math.PI/2,g='';const R=54,r=33,C=60;
  items.forEach((it,i)=>{const f=it.value/tot;if(f<=0)return;const b=a+f*2*Math.PI*.9999;const lg=f>.5?1:0;const p=(rad,ang)=>(C+rad*Math.cos(ang)).toFixed(2)+' '+(C+rad*Math.sin(ang)).toFixed(2);g+=`<path d="M${p(R,a)}A${R} ${R} 0 ${lg} 1 ${p(R,b)}L${p(r,b)}A${r} ${r} 0 ${lg} 0 ${p(r,a)}Z" fill="${PAL[i%PAL.length]}"><title>${esc(it.label+': '+fmt(it.value))}</title></path>`;a=b});
  return `<div class="row" style="gap:18px;flex-wrap:nowrap"><svg viewBox="0 0 120 120" style="width:124px;flex:none">${g}</svg><div style="display:grid;gap:4px;font-size:.88rem;min-width:0">${items.map((it,i)=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PAL[i%PAL.length]};margin-right:6px"></i>${esc(it.label)} <b>${Math.round(it.value/tot*100)}%</b></span>`).join('')}</div></div>`}
function trayGauge(frac,status){const n=Math.max(0,Math.min(30,Math.round(frac*30)));let h='';for(let i=0;i<30;i++)h+=`<i class="${i<n?'f':''}"></i>`;return `<div class="tray ${status||''}" aria-hidden="true">${h}</div>`}

/* ---------------- scanner: USB/Bluetooth wedge, camera, NFC ---------------- */
let scanHandler=null; // screens set this to receive scans; null = global lookup
(function wedge(){let buf='',last=0;document.addEventListener('keydown',e=>{const t=e.target;const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);if(typing&&!t.hasAttribute('data-scanbox'))return;const now=Date.now();if(now-last>80)buf='';last=now;
  if(e.key==='Enter'){if(t&&t.hasAttribute&&t.hasAttribute('data-scanbox')){const v=t.value.trim();if(v){e.preventDefault();t.value='';emitScan(v)}buf='';return}if(buf.length>=4){e.preventDefault();const c=buf;buf='';emitScan(c)}buf=''}else if(e.key.length===1&&!typing)buf+=e.key})})();
function emitScan(c){c=String(c).trim();if(!c)return;if(navigator.vibrate)navigator.vibrate(40);if(scanHandler){try{if(scanHandler(c)!==false)return}catch(e){toast(e.message,'bad');return}}globalLookup(c)}
function findByCode(c){const q=String(c).toLowerCase();const eq=v=>v&&String(v).toLowerCase()===q;
  let r=DB.all('products').find(p=>eq(p.barcode)||eq(p.sku)||eq(p.rfid));if(r)return {type:'product',rec:r};
  r=DB.all('batches').find(b=>eq(b.lotNo));if(r)return {type:'batch',rec:r};
  r=DB.all('equipment').find(p=>eq(p.tag)||eq(p.barcode)||eq(p.rfid));if(r)return {type:'equipment',rec:r};
  r=DB.all('orders').find(o=>eq(o.no)||eq(o.trackCode));if(r)return {type:'order',rec:r};
  r=DB.all('customers').find(o=>eq(o.code));if(r)return {type:'customer',rec:r};return null}
async function openCamera(onCode,{once=true,title='Scan a barcode or QR code'}={}){
  let stop=()=>{},seen='',seenAt=0;
  const m=modal({title,cls:'narrow',body:`<div id="camwrap"><video class="scan" playsinline muted></video></div><p class="small muted" style="margin:8px 0 0">Point the camera at the code. USB and Bluetooth scanners work anywhere in the app without opening this window.</p><div class="row" style="margin-top:10px"><input data-scanbox placeholder="Or type the code and press Enter" aria-label="Type a code"></div>`,foot:('NDEFReader' in window?`<button class="btn" data-nfc>${I('nfc')}Read NFC tag</button>`:'')+`<button class="btn" data-x>Close</button>`,onClose:()=>{stop();scanHandler=prev}});
  const prev=scanHandler;const hit=c=>{if(c===seen&&Date.now()-seenAt<1500)return;seen=c;seenAt=Date.now();if(navigator.vibrate)navigator.vibrate(40);if(once){m.close();onCode(c)}else onCode(c)};
  scanHandler=c=>{hit(c);return true};
  const nb=$('[data-nfc]',m.el);if(nb)nb.onclick=()=>readNfc(hit);
  try{
    if('BarcodeDetector' in window){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('video',m.el);v.srcObject=stream;await v.play();
      let fmts;try{fmts=await BarcodeDetector.getSupportedFormats()}catch(e){}
      const det=new BarcodeDetector(fmts&&fmts.length?{formats:fmts}:undefined);let run=true;stop=()=>{run=false;stream.getTracks().forEach(t=>t.stop())};
      (async function loop(){while(run){try{const r=await det.detect(v);if(r.length)hit(r[0].rawValue)}catch(e){}await sleep(160)}})();
    }else{
      await libScan();$('#camwrap',m.el).innerHTML='<div id="h5q"></div>';const q=new Html5Qrcode('h5q');
      await q.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},t=>hit(t),()=>{});stop=()=>{q.stop().catch(()=>{})};
    }
  }catch(e){$('#camwrap',m.el).innerHTML=`<div class="empty">The camera could not start (${esc(e.message||e.name)}). Allow camera access for this site, or type the code below. Camera scanning needs https.</div>`}
  return m;
}
async function readNfc(cb){try{const r=new NDEFReader();await r.scan();toast('Hold the tag near the back of the phone.');r.onreading=ev=>{let c=String(ev.serialNumber||'').replace(/:/g,'').toUpperCase();for(const rec of ev.message.records){if(rec.recordType==='text'){try{c=new TextDecoder(rec.encoding||'utf-8').decode(rec.data)}catch(e){}}}cb(c)}}catch(e){toast('NFC is not available: '+e.message,'bad')}}
A['scan.open']=()=>openCamera(c=>emitScan(c));

/* ---------------- stock engine (ledger-based) ---------------- */
function stock(){if(_stk)return _stk;const by={},bb={},tot={};for(const m of M.movements.values()){if(m._d)continue;const k=m.productId+'|'+m.warehouseId;by[k]=(by[k]||0)+m.qty;tot[m.productId]=(tot[m.productId]||0)+m.qty;if(m.batchId){const k2=m.batchId+'|'+m.warehouseId;bb[k2]=(bb[k2]||0)+m.qty}}return _stk={by,bb,tot}}
const onHand = (pid,wh)=>r2(wh?(stock().by[pid+'|'+wh]||0):(stock().tot[pid]||0));
function batchStock(pid,wh){const s=stock().bb,o=[];for(const b of M.batches.values()){if(b._d||b.productId!==pid)continue;let q=0;if(wh)q=s[b.id+'|'+wh]||0;else for(const w of M.warehouses.values())q+=s[b.id+'|'+w.id]||0;if(q>0.0001)o.push({batch:b,qty:r2(q)})}return o.sort((a,b)=>String(a.batch.expiryDate||'9999').localeCompare(String(b.batch.expiryDate||'9999')))}
function allocFEFO(pid,wh,qty){const out=[];let left=qty;for(const {batch,qty:q} of batchStock(pid,wh)){if(left<=0)break;const take=Math.min(q,left);out.push({batchId:batch.id,qty:take,cost:num(batch.cost)});left=r2(left-take)}
  if(left>0){if(!CFG().tax.allowNegativeStock){const p=DB.get('products',pid);throw new Error('Not enough stock of '+(p?.name||'item')+' in '+DB.name('warehouses',wh)+'. Short by '+fn(left,left%1?2:0)+'.')}out.push({batchId:'',qty:left,cost:num(DB.get('products',pid)?.cost)})}return out}
function postMove(m){const rec={id:m.id||uid('mv_'),ts:m.ts||Date.now(),date:m.date||today(),type:m.type,productId:m.productId,batchId:m.batchId||'',warehouseId:m.warehouseId,qty:r2(m.qty),unitCost:r2(m.unitCost),ref:m.ref||'',refNo:m.refNo||'',note:m.note||'',by:S.user?.username||'store'};DB.put('movements',rec,{silent:true});return rec}
function stockStatus(p){const q=onHand(p.id);if(q<=0)return 'out';if(q<=num(p.reorderLevel))return 'low';return 'ok'}
function checkLowStock(pids){for(const pid of new Set(pids)){const p=DB.get('products',pid);if(!p||!num(p.reorderLevel))continue;const q=onHand(pid);if(q<=num(p.reorderLevel)){const k='low_'+pid+'_'+today();if(KV[k])continue;kvSet(k,1);notify('low_stock',{product:p.name,qty:fn(q),unit:p.unit||'',reorder:fn(p.reorderLevel)},{admin:true,refId:pid})}}}
function docNo(kind){return (CFG().numbering?.[kind]||kind.toUpperCase())+'-'+today().slice(2).replace(/-/g,'')+'-'+code(4)}
const defaultWh = ()=>S.user?.warehouseId&&DB.get('warehouses',S.user.warehouseId)?S.user.warehouseId:(DB.all('warehouses').find(w=>w.active!==false)?.id||'');
const whOptions = ()=>DB.all('warehouses').filter(w=>w.active!==false).map(w=>[w.id,w.name]);

function tpl(s,ctx){return String(s||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>ctx[k]??'')}
function notify(event,ctx,{customer,supplier,admin,refId}={}){
  const n=CFG().notify;if(!n.events?.[event])return 0;const c=CFG().company;ctx={company:c.name,...ctx};const msg=tpl(n.templates?.[event],ctx);if(!msg)return 0;
  const tgt=[];const ch=n.channels||{};const who=customer||supplier;
  if(who){const pref=who.notifyChannels&&who.notifyChannels.length?who.notifyChannels:null;const want=k=>ch[k]&&(!pref||pref.includes(k));
    if(want('email')&&who.email)tgt.push(['email',who.email]);if(want('sms')&&who.phone)tgt.push(['sms',who.phone]);if(want('whatsapp')&&(who.whatsapp||who.phone))tgt.push(['whatsapp',who.whatsapp||who.phone]);if(want('viber')&&who.viberId)tgt.push(['viber',who.viberId]);if(want('messenger')&&who.messengerId)tgt.push(['messenger',who.messengerId])}
  if(admin){if(ch.email&&n.adminEmail)tgt.push(['email',n.adminEmail]);if(ch.sms&&n.adminPhone)tgt.push(['sms',n.adminPhone])}
  for(const [channel,to] of tgt)DB.put('notifications',{id:uid('nt_'),ts:Date.now(),event,channel,to,subject:c.name+': '+cap(event),message:msg,status:cloud()?'queued':'manual',refId:refId||''},{silent:true});
  return tgt.length}
function notifyLink(n){const m=encodeURIComponent(n.message),ph=String(n.to).replace(/[^\d+]/g,''),intl=ph.replace(/^\+/,'').replace(/^0/,'63');

function calcOrder(o){const T=CFG().tax;const rate=num(T.vatRate)/100;let sub=0,taxBase=0;for(const l of o.lines){const a=r2(l.qty*l.price);sub+=a;if(l.taxable)taxBase+=a}
  let disc=0;if(o.discountType==='sc')disc=r2(sub*num(T.scRate)/100);else if(o.discountType==='pct')disc=r2(sub*num(o.discountValue)/100);else if(o.discountType==='amt')disc=Math.min(sub,num(o.discountValue));
  const f=sub>0?(sub-disc)/sub:1;const tb=taxBase*f;let tax=0,total=sub-disc;if(T.pricesIncludeVat)tax=r2(tb*rate/(1+rate));else{tax=r2(tb*rate);total+=tax}
  o.subtotal=r2(sub);o.discount=r2(disc);o.tax=tax;o.vatable=r2(T.pricesIncludeVat?tb-tax:tb);o.exempt=r2((sub-taxBase)*f);o.total=r2(total+num(o.deliveryFee));o.paid=r2(o.paid||0);o.payStatus=o.paid>=o.total-0.005&&o.total>0?'paid':o.paid>0?'partial':'unpaid';return o}

function unpostOrderStock(o){if(!o.stockPosted)return;for(const m of DB.where('movements',m=>m.ref===o.id&&m.type==='sale'))if(!M.movements.has('rv_'+m.id))postMove({id:'rv_'+m.id,type:'return',productId:m.productId,batchId:m.batchId,warehouseId:m.warehouseId,qty:-m.qty,unitCost:m.unitCost,ref:o.id,refNo:o.no,note:'Order cancelled'});o.stockPosted=false}

function setOrderStatus(o,status,{quiet}={}){
  if(o.status===status)return;if(o.status==='cancelled')throw new Error('A cancelled order cannot be reopened. Create a new one.');
  if(['picked','out_for_delivery','delivered'].includes(status))postOrderStock(o);

}

function newBatch(p,{lotNo,layDate,supplierId,cost,receivedDate}){const lay=layDate||today();return DB.put('batches',{id:uid('ba_'),lotNo:lotNo||('L'+today().slice(2).replace(/-/g,'')+'-'+code(3)),productId:p.id,supplierId:supplierId||'',layDate:lay,receivedDate:receivedDate||today(),expiryDate:num(p.shelfLifeDays)?addDays(lay,num(p.shelfLifeDays)):'',cost:r2(cost??p.cost)},{silent:true})}

  await formModal({title:isIn?'Stock in':'Stock out or breakage',saveLabel:'Post',fields:[{k:'productId',label:'Item',type:'select',req:1,options:prodOptions(),full:1},{k:'warehouseId',label:'Warehouse',type:'select',req:1,options:whOptions,def:INVWH||defaultWh()},{k:'qty',label:'Quantity',type:'number',req:1,min:0.01},
    ...(isIn?[{k:'type',label:'Reason',type:'select',req:1,options:[['adjust','Opening balance or adjustment'],['return','Customer return']]},{k:'cost',label:'Cost per unit',type:'money',hint:'Leave empty to use the item cost.'},{k:'lotNo',label:'Lot number',hint:'Leave empty to generate one.'},{k:'layDate',label:'Lay or production date',type:'date',def:today()}]
      :[{k:'type',label:'Reason',type:'select',req:1,options:[['breakage','Breakage or cracked'],['adjust','Spoilage, loss or adjustment']]}]),{k:'note',label:'Note',full:1}],
    onSave:v=>{const p=DB.get('products',v.productId);if(isIn){const b=newBatch(p,{lotNo:v.lotNo,layDate:v.layDate,cost:v.cost||p.cost});postMove({type:v.type,productId:p.id,batchId:b.id,warehouseId:v.warehouseId,qty:v.qty,unitCost:b.cost,note:v.note})}
      else{for(const a of allocFEFO(p.id,v.warehouseId,v.qty))postMove({type:v.type,productId:p.id,batchId:a.batchId,warehouseId:v.warehouseId,qty:-a.qty,unitCost:a.cost,note:v.note});checkLowStock([p.id])}audit(isIn?'stock in':'stock out','products',p.id,v.qty+' '+p.name)}});refresh()};
A['inv.transfer']=async()=>{need('inventory',2);if(whOptions().length<2)throw new Error('Add a second warehouse first.');
  await formModal({title:'Transfer between warehouses',saveLabel:'Transfer',fields:[{k:'productId',label:'Item',type:'select',req:1,options:prodOptions(),full:1},{k:'from',label:'From',type:'select',req:1,options:whOptions,def:defaultWh()},{k:'to',label:'To',type:'select',req:1,options:whOptions},{k:'qty',label:'Quantity',type:'number',req:1,min:0.01},{k:'note',label:'Note'}],
    onSave:v=>{if(v.from===v.to)throw new Error('Choose two different warehouses.');const ref=uid('tr_'),no='TR-'+code(5);for(const a of allocFEFO(v.productId,v.from,v.qty)){postMove({type:'transfer_out',productId:v.productId,batchId:a.batchId,warehouseId:v.from,qty:-a.qty,unitCost:a.cost,ref,refNo:no,note:v.note});postMove({type:'transfer_in',productId:v.productId,batchId:a.batchId,warehouseId:v.to,qty:a.qty,unitCost:a.cost,ref,refNo:no,note:v.note})}audit('transfer','products',v.productId,v.qty+' '+no)}});refresh()};
A['inv.repack']=async()=>{need('inventory',2);const eggs=prodOptions(p=>num(p.eggsPerUnit)>0);
  await formModal({title:'Grade and repack',saveLabel:'Post',cls:'wide',pre:`<p class="muted" style="margin-top:0">Turn one item into others, for example ungraded trays into sized trays, or a case into dozens. Eggs not accounted for are recorded as breakage.</p>`,
    fields:[{k:'src',label:'Take from item',type:'select',req:1,options:eggs},{k:'warehouseId',label:'Warehouse',type:'select',req:1,options:whOptions,def:defaultWh()},{k:'qty',label:'Quantity to take',type:'number',req:1,min:0.01},{type:'sep',label:'Produce'},...[1,2,3,4,5,6].flatMap(i=>[{k:'p'+i,label:'Output item '+i,type:'select',options:eggs},{k:'q'+i,label:'Quantity',type:'number',min:0}])],
    onSave:v=>{const sp=DB.get('products',v.src);const outs=[1,2,3,4,5,6].map(i=>({p:DB.get('products',v['p'+i]),q:num(v['q'+i])})).filter(o=>o.p&&o.q>0);if(!outs.length)throw new Error('Add at least one output item and quantity.');
      const eggsIn=v.qty*num(sp.eggsPerUnit),eggsOut=sum(outs,o=>o.q*num(o.p.eggsPerUnit));if(eggsOut>eggsIn+0.001)throw new Error('Outputs use '+fn(eggsOut)+' eggs but only '+fn(eggsIn)+' are being taken.');
      const al=allocFEFO(sp.id,v.warehouseId,v.qty);const ref=uid('rp_'),no='RP-'+code(5);let cost=0,lay='9999';for(const a of al){postMove({type:'repack_out',productId:sp.id,batchId:a.batchId,warehouseId:v.warehouseId,qty:-a.qty,unitCost:a.cost,ref,refNo:no});cost+=a.qty*a.cost;const b=DB.get('batches',a.batchId);if(b?.layDate&&b.layDate<lay)lay=b.layDate}
      const perEgg=eggsOut?cost/eggsOut:0;const sup=DB.get('batches',al[0]?.batchId)?.supplierId;for(const o of outs){const b=newBatch(o.p,{layDate:lay==='9999'?today():lay,supplierId:sup,cost:perEgg*num(o.p.eggsPerUnit)});postMove({type:'repack_in',productId:o.p.id,batchId:b.id,warehouseId:v.warehouseId,qty:o.q,unitCost:b.cost,ref,refNo:no})}
      audit('repack','products',sp.id,no+': '+fn(eggsIn-eggsOut)+' eggs lost');toast('Repacked. '+fn(eggsIn-eggsOut)+' eggs recorded as grading loss.','good')}});refresh()};
A['inv.label']=async el=>{const p=DB.get('products',el.dataset.id);if(!p.barcode)throw new Error('Give this item a barcode first.');await libBarcode();const n=12;const m=printDoc('Barcode labels',`<div class="label-sheet">${[...Array(n)].map(()=>`<div><b>${esc(p.name)}</b><br><svg class="bc"></svg><br>${fm(p.price)}</div>`).join('')}</div>`);$$('.bc',m.el).forEach(s=>{try{JsBarcode(s,p.barcode,{height:38,width:1.5,fontSize:12,margin:2})}catch(e){s.outerHTML='<span>'+esc(p.barcode)+'</span>'}})};

function invCounts(v){listPage(v,{table:'counts',mod:'inventory',noun:'stock counts',sort:'date',dir:-1,noImport:true,addLabel:'Start a count',noDelete:true,
  onAdd:async()=>{await formModal({title:'Start a stock count',cls:'narrow',saveLabel:'Start counting',fields:[{k:'warehouseId',label:'Warehouse',type:'select',req:1,options:whOptions,def:defaultWh(),full:1}],onSave:x=>{const c=DB.put('counts',{id:uid('ct_'),no:docNo('count'),date:today(),warehouseId:x.warehouseId,status:'open',lines:DB.all('products').filter(p=>p.active!==false).map(p=>({productId:p.id,system:onHand(p.id,x.warehouseId),counted:null}))});setTimeout(()=>countView(c.id),50)}})},
  onEdit:r=>countView(r.id),cols:[{k:'no',label:'Count'},{k:'date',label:'Date',fmt:v=>fd(v)},{k:'warehouseId',label:'Warehouse',fmt:v=>esc(DB.name('warehouses',v))},{k:'status',label:'Status',fmt:statusBadge},{k:'lines',label:'Items counted',num:1,fmt:v=>v.filter(l=>l.counted!=null).length+' of '+v.length}]})}
function countView(id){const c=DB.get('counts',id);closeAllModals();const open=c.status==='open';const prev=scanHandler;
  const m=modal({title:'Stock count '+c.no,cls:'wide',onClose:()=>{scanHandler=prev;refresh()},body:`<p class="muted" style="margin-top:0">${esc(DB.name('warehouses',c.warehouseId))}. ${open?'Type the counted quantity, or scan items: each scan adds one.':'Posted.'}</p>${open?`<div class="row" style="margin-bottom:10px"><input data-scanbox placeholder="Scan or type a barcode, then Enter"><button class="btn" data-cam>${I('cam')}Camera</button></div>`:''}
   <table class="t"><thead><tr><th>Item</th><th class="num">System</th><th class="num">Counted</th><th class="num">Difference</th></tr></thead><tbody>${c.lines.map((l,i)=>`<tr><td>${esc(DB.name('products',l.productId))}</td><td class="num">${fn(l.system,l.system%1?2:0)}</td><td class="num">${open?`<input type="number" step="any" data-i="${i}" value="${l.counted??''}" style="width:100px;text-align:right">`:fn(l.counted??l.system)}</td><td class="num" data-diff="${i}">${l.counted==null?'':fn(l.counted-l.system,2)}</td></tr>`).join('')}</tbody></table>`,
   foot:open?`<button class="btn" data-x>Save and close</button><button class="btn pri" data-post>Post differences</button>`:`<button class="btn" data-x>Close</button>`});
  if(!open)return;const save=()=>DB.put('counts',c,{silent:true});
  const setv=(i,val)=>{c.lines[i].counted=val;const inp=$(`input[data-i="${i}"]`,m.el);if(inp&&inp.value!==String(val??''))inp.value=val??'';$(`[data-diff="${i}"]`,m.el).textContent=val==null?'':fn(val-c.lines[i].system,2);save()};
  m.el.addEventListener('change',e=>{const i=e.target.dataset.i;if(i!==undefined&&e.target.type==='number')setv(+i,e.target.value===''?null:num(e.target.value))});
  scanHandler=cd=>{const f=findByCode(cd);const i=f&&f.type==='product'?c.lines.findIndex(l=>l.productId===f.rec.id):-1;if(i<0){toast('That code is not an item in this count.','bad');return true}setv(i,num(c.lines[i].counted)+1);toast(f.rec.name+': '+c.lines[i].counted);return true};
  $('[data-cam]',m.el).onclick=()=>openCamera(cd=>scanHandler(cd),{once:false,title:'Scan items to count'});
  $('[data-post]',m.el).onclick=async()=>{try{need('inventory',3);const diffs=c.lines.filter(l=>l.counted!=null&&r2(l.counted-l.system)!==0);if(!await confirmBox(diffs.length?'Post '+diffs.length+' difference(s) as stock adjustments? Items left blank are not changed.':'No differences found. Close this count?','Post count'))return;
    for(const l of diffs){const d=r2(l.counted-onHand(l.productId,c.warehouseId));const p=DB.get('products',l.productId);if(d>0){const b=newBatch(p,{lotNo:'CNT-'+code(4)});postMove({type:'count',productId:p.id,batchId:b.id,warehouseId:c.warehouseId,qty:d,unitCost:p.cost,ref:c.id,refNo:c.no})}else if(d<0){const bs=batchStock(p.id,c.warehouseId);let left=-d;for(const b of bs){if(left<=0)break;const t=Math.min(b.qty,left);postMove({type:'count',productId:p.id,batchId:b.batch.id,warehouseId:c.warehouseId,qty:-t,unitCost:b.batch.cost,ref:c.id,refNo:c.no});left=r2(left-t)}if(left>0)postMove({type:'count',productId:p.id,warehouseId:c.warehouseId,qty:-left,unitCost:p.cost,ref:c.id,refNo:c.no})}}
    c.status='posted';DB.put('counts',c);m.close();toast('Count posted.','good')}catch(e){toast(e.message,'bad')}};
}

ROUTES.procurement={title:'Procurement',render(el,sub){sub=sub||'orders';
  el.innerHTML=tabs('procurement',[['orders','Purchase orders'],['receipts','Goods received'],['suggest','Reorder suggestions']],sub)+'<div id="pv"></div>';const v=$('#pv');
  if(sub==='orders')listPage(v,{table:'pos',mod:'procurement',noun:'purchase orders',sort:'date',dir:-1,noImport:true,addLabel:'New purchase order',onAdd:()=>poEdit(null),onEdit:r=>poView(r.id),noDelete:true,chips:{k:'status',options:['draft','for_approval','approved','partially_received','received','cancelled']},searchFn:(r,q)=>DB.name('suppliers',r.supplierId).toLowerCase().includes(q),
    cols:[{k:'no',label:'PO',fmt:(v,r)=>`<a href="#" data-act="po.view" data-id="${r.id}"><b>${esc(v)}</b></a>`},{k:'date',label:'Date',fmt:v=>fd(v)},{k:'supplierId',label:'Supplier',fmt:v=>esc(DB.name('suppliers',v)),sv:r=>DB.name('suppliers',r.supplierId)},{k:'expected',label:'Expected',fmt:v=>fd(v)},{k:'status',label:'Status',fmt:statusBadge},{k:'total',label:'Total',num:1,fmt:v=>fm(v)}]});
  else if(sub==='receipts')listPage(v,{table:'receipts',mod:'procurement',noun:'receipts',readonly:true,sort:'date',dir:-1,cols:[{k:'no',label:'Receipt'},{k:'date',label:'Date',fmt:v=>fd(v)},{k:'poNo',label:'PO'},{k:'supplierId',label:'Supplier',fmt:v=>esc(DB.name('suppliers',v))},{k:'warehouseId',label:'Into',fmt:v=>esc(DB.name('warehouses',v))},{k:'lines',label:'Accepted',num:1,fmt:v=>fn(sum(v,l=>l.qty))},{k:'id',label:'Rejected',num:1,fmt:(v,r)=>fn(sum(r.lines,l=>l.rejected))},{k:'by',label:'Received by'}]});
  else{const sg=reorderPlan().filter(s=>s.suggest>0);v.innerHTML=`<p class="muted" style="margin-top:0">CYRA forecasts demand for each item and suggests what to buy to cover the supplier lead time plus ${CFG().ai.reviewDays} days, with safety stock.</p><div class="panel"><div class="tw"><table class="t rsp"><thead><tr><th>Item</th><th class="num">On hand</th><th class="num">On order</th><th class="num">Forecast per day</th><th class="num">Days of cover</th><th class="num">Suggested order</th></tr></thead><tbody>${sg.map(s=>`<tr><td data-l="Item"><b>${esc(s.p.name)}</b></td><td data-l="On hand" class="num">${fn(s.stock)}</td><td data-l="On order" class="num">${fn(s.onOrder)}</td><td data-l="Forecast per day" class="num">${fn(s.daily,1)}</td><td data-l="Days of cover" class="num">${s.daily>0?fn(s.cover,1):'n/a'}</td><td data-l="Suggested" class="num"><b>${fn(s.suggest)}</b> ${esc(s.p.unit||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Stock levels cover the forecast. Nothing to order right now.</td></tr>'}</tbody></table></div></div>${sg.length&&can('procurement',2)?`<button class="btn pri" style="margin-top:12px" data-act="po.fromplan">Create a purchase order from these</button>`:''}`}
}};
A['po.view']=el=>poView(el.dataset.id);
A['po.fromplan']=()=>poEdit(null,reorderPlan().filter(s=>s.suggest>0).map(s=>({productId:s.p.id,name:s.p.name,qty:s.suggest,cost:num(s.p.cost),received:0})));
function poEdit(id,preLines){need('procurement',2);const po=id?clone(DB.get('pos',id)):{id:uid('po_'),no:docNo('po'),date:today(),status:'draft',supplierId:'',warehouseId:defaultWh(),expected:addDays(today(),CFG().ai.leadDays),lines:preLines||[],notes:'',requestedBy:S.user.username};
  closeAllModals();const sups=DB.all('suppliers').filter(s=>s.active!==false);const ps=prodOptions()();
  const m=modal({title:(id?'Edit ':'New ')+'purchase order '+po.no,cls:'wide',body:`<div class="form"><label class="f">Supplier *<select name="supplierId"><option value="">Choose…</option>${sups.map(s=>`<option value="${s.id}"${s.id===po.supplierId?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="f">Deliver to${whSelect(po.warehouseId,'name="warehouseId"')}</label><label class="f">Order date<input type="date" name="date" value="${po.date}"></label><label class="f">Expected delivery<input type="date" name="expected" value="${po.expected||''}"></label></div>
    <h3 style="margin:14px 0 6px">Items</h3><div id="pol"></div><button class="btn sm" data-add style="margin-top:8px">${I('plus')}Add item</button><label class="f" style="margin-top:12px">Notes<textarea name="notes">${esc(po.notes||'')}</textarea></label><div class="err"></div>`,
    foot:`<button class="btn" data-x>Cancel</button><button class="btn" data-save="draft">Save draft</button><button class="btn pri" data-save="for_approval">Submit for approval</button>`});
  const draw=()=>{$('#pol',m.el).innerHTML=(po.lines.length?po.lines.map((l,i)=>`<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><select data-i="${i}" data-f="productId" class="grow" aria-label="Item"><option value="">Choose item…</option>${ps.map(([a,b])=>`<option value="${a}"${a===l.productId?' selected':''}>${esc(b)}</option>`).join('')}</select><input type="number" step="any" data-i="${i}" data-f="qty" value="${l.qty||''}" placeholder="Qty" style="width:90px" aria-label="Quantity"><input type="number" step="0.01" data-i="${i}" data-f="cost" value="${l.cost||''}" placeholder="Cost" style="width:100px" aria-label="Unit cost"><button class="btn sm dan" data-rm="${i}" aria-label="Remove">${I('trash')}</button></div>`).join(''):'<p class="muted small">No items yet.</p>')+`<div class="tot big" style="max-width:300px;margin-left:auto"><span>Total</span><span class="num">${fm(sum(po.lines,l=>num(l.qty)*num(l.cost)))}</span></div>`};draw();
  m.el.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){const l=po.lines[+t.dataset.i];if(t.dataset.f==='productId'){const p=DB.get('products',t.value);l.productId=t.value;l.name=p?.name||'';if(p&&!l.cost)l.cost=num(p.cost);if(p&&!l.qty)l.qty=num(p.reorderQty)}else l[t.dataset.f]=num(t.value);draw()}});
  m.el.addEventListener('click',e=>{const t=e.target.closest('[data-add],[data-rm],[data-save]');if(!t)return;if(t.dataset.add!==undefined){po.lines.push({productId:'',name:'',qty:0,cost:0,received:0});draw()}else if(t.dataset.rm!==undefined){po.lines.splice(+t.dataset.rm,1);draw()}else{try{for(const n of ['supplierId','warehouseId','date','expected','notes'])po[n]=$(`[name=${n}]`,m.el).value;if(!po.supplierId)throw new Error('Choose a supplier.');po.lines=po.lines.filter(l=>l.productId&&num(l.qty)>0);if(!po.lines.length)throw new Error('Add at least one item with a quantity.');po.total=r2(sum(po.lines,l=>l.qty*l.cost));po.status=t.dataset.save;DB.put('pos',po);if(po.status==='for_approval')notify('po_for_approval',{poNo:po.no,supplier:DB.name('suppliers',po.supplierId),total:fm(po.total)},{admin:true,refId:po.id});m.close();refresh();toast(po.status==='draft'?'Draft saved.':'Submitted for approval.','good')}catch(x){$('.err',m.el).textContent=x.message}}});
}
function poView(id){const po=DB.get('pos',id);if(!po)return;closeAllModals();const s=DB.get('suppliers',po.supplierId);const canRecv=['approved','partially_received'].includes(po.status);
  modal({title:'Purchase order '+po.no,cls:'wide',body:`<div class="row between" style="margin-bottom:10px"><div><b>${esc(s?.name||'')}</b><div class="small muted">Ordered ${fd(po.date)} · expected ${fd(po.expected)} · deliver to ${esc(DB.name('warehouses',po.warehouseId))}</div></div>${statusBadge(po.status)}</div>
   <table class="t"><thead><tr><th>Item</th><th class="num">Ordered</th><th class="num">Received</th><th class="num">Cost</th><th class="num">Amount</th></tr></thead><tbody>${po.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="num">${fn(l.qty)}</td><td class="num">${fn(l.received||0)}</td><td class="num">${fm(l.cost)}</td><td class="num">${fm(l.qty*l.cost)}</td></tr>`).join('')}</tbody></table><div class="tot big" style="max-width:300px;margin-left:auto"><span>Total</span><span class="num">${fm(po.total)}</span></div>
   <p class="small muted">Requested by ${esc(po.requestedBy||'')}${po.approvedBy?' · approved by '+esc(po.approvedBy)+' on '+fdt(po.approvedAt):''}</p>${po.notes?`<p class="small">${esc(po.notes)}</p>`:''}`,
   foot:`<button class="btn" data-act="po.print" data-id="${po.id}">${I('print')}Print</button>${['draft','for_approval'].includes(po.status)&&can('procurement',2)?`<button class="btn" data-act="po.edit" data-id="${po.id}">${I('edit')}Edit</button>`:''}${!['received','cancelled'].includes(po.status)&&can('procurement',3)?`<button class="btn dan" data-act="po.set" data-id="${po.id}" data-s="cancelled">Cancel</button>`:''}${['draft','for_approval'].includes(po.status)&&can('procurement',3)?`<button class="btn pri" data-act="po.set" data-id="${po.id}" data-s="approved">Approve</button>`:''}${canRecv&&can('procurement',2)?`<button class="btn pri" data-act="po.receive" data-id="${po.id}">Receive goods</button>`:''}`})}
A['po.edit']=el=>poEdit(el.dataset.id);
A['po.set']=async el=>{need('procurement',3);const po=DB.get('pos',el.dataset.id);const s=el.dataset.s;if(s==='cancelled'&&!await confirmBox('Cancel purchase order '+po.no+'?','Cancel PO',true))return;po.status=s;if(s==='approved'){po.approvedBy=S.user.username;po.approvedAt=Date.now()}DB.put('pos',po,{note:po.no+' → '+s});if(s==='approved')notify('po_approved',{poNo:po.no,supplier:DB.name('suppliers',po.supplierId),total:fm(po.total),expected:fd(po.expected)},{supplier:DB.get('suppliers',po.supplierId),refId:po.id});refresh();poView(po.id)};
A['po.print']=el=>{const po=DB.get('pos',el.dataset.id);const s=DB.get('suppliers',po.supplierId);printDoc('Purchase order '+po.no,`${letterhead()}<div class="row between"><h3>Purchase order</h3><div class="right"><b>${esc(po.no)}</b><div class="small">${fd(po.date)}</div></div></div><p>To: <b>${esc(s?.name||'')}</b><br><span class="small">${esc(s?.address||'')} ${esc(s?.phone||'')}</span><br><span class="small">Deliver by ${fd(po.expected)} to ${esc(DB.name('warehouses',po.warehouseId))}</span></p><table class="t"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Amount</th></tr></thead><tbody>${po.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="num">${fn(l.qty)}</td><td class="num">${fm(l.cost)}</td><td class="num">${fm(l.qty*l.cost)}</td></tr>`).join('')}</tbody></table><div class="tot big" style="max-width:300px;margin-left:auto"><span>Total</span><span class="num">${fm(po.total)}</span></div><div class="grid g2" style="margin-top:40px"><div>Prepared by: ${esc(po.requestedBy||'')}</div><div>Approved by: ${esc(po.approvedBy||'______________')}</div></div>`)};
A['po.receive']=el=>{need('procurement',2);const po=DB.get('pos',el.dataset.id);closeAllModals();const rem=po.lines.map(l=>Math.max(0,r2(l.qty-num(l.received))));
  const m=modal({title:'Receive goods for '+po.no,cls:'wide',body:`<p class="muted" style="margin-top:0">Enter what arrived. Rejected units, such as cracked or dirty eggs, are recorded against the supplier and do not enter stock.</p><div class="form"><label class="f">Receive into${whSelect(po.warehouseId,'name="wh"')}</label><label class="f">Date received<input type="date" name="date" value="${today()}"></label></div>
   <div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Item</th><th class="num">Remaining</th><th>Accepted</th><th>Rejected</th><th>Lot number</th><th>Lay date</th></tr></thead><tbody>${po.lines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="num">${fn(rem[i])}</td><td><input type="number" step="any" min="0" data-q="${i}" value="${rem[i]}" style="width:90px"></td><td><input type="number" step="any" min="0" data-r="${i}" value="0" style="width:80px"></td><td><input data-lot="${i}" placeholder="Auto" style="width:120px"></td><td><input type="date" data-lay="${i}" value="${addDays(today(),-1)}"></td></tr>`).join('')}</tbody></table></div><label class="f" style="margin-top:10px">Notes<input name="notes"></label><div class="err"></div>`,foot:`<button class="btn" data-x>Cancel</button><button class="btn pri" data-go>Post receipt</button>`});
  $('[data-go]',m.el).onclick=()=>{try{const wh=$('[name=wh]',m.el).value,date=$('[name=date]',m.el).value||today();const lines=[];po.lines.forEach((l,i)=>{const q=num($(`[data-q="${i}"]`,m.el).value),rj=num($(`[data-r="${i}"]`,m.el).value);if(q<=0&&rj<=0)return;lines.push({i,l,q,rj,lot:$(`[data-lot="${i}"]`,m.el).value.trim(),lay:$(`[data-lay="${i}"]`,m.el).value})});if(!lines.length)throw new Error('Enter at least one quantity.');

        if(num(x.l.cost)>0){p.cost=r2(before>0?(before*num(p.cost)+x.q*x.l.cost)/(before+x.q):x.l.cost);DB.put('products',p,{silent:true})}}
      po.lines[x.i].received=r2(num(po.lines[x.i].received)+x.q);rc.lines.push({productId:x.l.productId,name:x.l.name,qty:x.q,rejected:x.rj,cost:x.l.cost,batchId:bid})}
    po.status=po.lines.every(l=>num(l.received)>=l.qty)?'received':'partially_received';DB.put('receipts',rc);DB.put('pos',po,{note:po.no+' received'});m.close();refresh();toast('Receipt '+rc.no+' posted to stock.','good')}catch(x){$('.err',m.el).textContent=x.message}}};

function optimizeStops(t){const pts=t.stops.map(s=>{const o=DB.get('orders',s.orderId);const c=o&&DB.get('customers',o.customerId);return {s,lat:num(c?.lat),lng:num(c?.lng),area:c?.area||''}});
  if(pts.filter(p=>p.lat&&p.lng).length>=2){const out=[];let cur=pts.filter(p=>p.lat).reduce((a,b)=>a.lat+a.lng>b.lat+b.lng?a:b);const rest=new Set(pts);while(rest.size){let best=null,bd=1e9;for(const p of rest){const d=p.lat?Math.hypot(p.lat-cur.lat,p.lng-cur.lng):1e6;if(d<bd){bd=d;best=p}}rest.delete(best);out.push(best);if(best.lat)cur=best}t.stops=out.map((p,i)=>({...p.s,seq:i+1}))}
  else{pts.sort((a,b)=>a.area.localeCompare(b.area));t.stops=pts.map((p,i)=>({...p.s,seq:i+1}))}}

  const stops=t.stops.map(s=>({s,o:DB.get('orders',s.orderId)})).filter(x=>x.o);const load={};for(const {s,o} of stops)if(s.status!=='failed')for(const l of o.lines)load[l.name]=(load[l.name]||0)+l.qty;
  const collect=sum(stops.filter(x=>x.s.status==='pending'),x=>x.o.total-x.o.paid);const done=stops.filter(x=>x.s.status!=='pending').length;
  $('#title').textContent='Trip '+t.no;
  el.innerHTML=`<div class="row" style="margin-bottom:12px"><a class="btn sm" href="#/deliveries">Back to trips</a>${statusBadge(t.status)}<span class="muted small">${fd(t.date)} · ${esc(DB.name('users',t.driverId))} · ${esc(DB.name('equipment',t.vehicleId)||'No vehicle')}${t.route?' · '+esc(t.route):''}</span><span class="grow"></span>
    <button class="btn sm" data-act="trip.print" data-id="${t.id}">${I('print')}Load sheet</button>${ed&&t.status==='planned'?`<button class="btn sm" data-act="trip.opt" data-id="${t.id}">Reorder stops</button><button class="btn pri" data-act="trip.start" data-id="${t.id}">${I('truck')}Load and start trip</button>`:''}${ed&&t.status==='in_transit'?`<button class="btn pri" data-act="trip.finish" data-id="${t.id}">Finish trip</button>`:''}</div>
   <div class="grid g3" style="margin-bottom:14px"><div class="kpi b"><span>Stops done</span><b>${done} of ${stops.length}</b></div><div class="kpi y"><span>Still to collect</span><b>${fm(collect)}</b></div><div class="kpi"><span>Load</span><b>${fn(sum(Object.values(load)))}</b><small class="muted">${esc(Object.entries(load).map(([k,v])=>fn(v)+' '+k.split(',')[0]).join(', ').slice(0,120))}</small></div></div>
   <div class="grid">${stops.map(({s,o})=>{const c=DB.get('customers',o.customerId);const maps='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c&&num(c.lat)?c.lat+','+c.lng:(o.address||o.customerName));return `<div class="card" style="border-left:4px solid ${s.status==='delivered'?'var(--ok)':s.status==='failed'?'var(--red)':'var(--line)'}"><div class="row between" style="align-items:flex-start"><div><span class="badge">Stop ${s.seq}</span> <b>${esc(o.customerName)}</b><div class="small muted">${esc(o.address||'')}</div><div class="small">${esc(o.lines.map(l=>fn(l.qty)+' × '+l.name).join('; '))}</div><div class="small">Order ${esc(o.no)} · collect <b>${fm(o.total-o.paid)}</b>${s.note?' · '+esc(s.note):''}</div></div>
     <div class="row">${statusBadge(s.status==='pending'?(t.status==='in_transit'?'out_for_delivery':'planned'):s.status)}<a class="btn sm" target="_blank" rel="noopener" href="${esc(maps)}">${I('pin')}Map</a>${o.contactPhone?`<a class="btn sm" href="tel:${esc(o.contactPhone)}">Call</a>`:''}${ed&&t.status==='in_transit'&&s.status==='pending'?`<button class="btn sm dan" data-act="trip.fail" data-id="${t.id}" data-o="${o.id}">Not delivered</button><button class="btn pri sm" data-act="trip.pod" data-id="${t.id}" data-o="${o.id}">Deliver</button>`:''}</div></div></div>`}).join('')}</div>`;
  scanHandler=c=>{const f=findByCode(c);if(f&&f.type==='order'&&t.stops.some(s=>s.orderId===f.rec.id&&s.status==='pending')&&t.status==='in_transit'){podModal(t.id,f.rec.id);return true}return false};
}
A['trip.opt']=el=>{const t=DB.get('deliveries',el.dataset.id);optimizeStops(t);DB.put('deliveries',t,{silent:true});refresh();toast('Stops reordered by location or zone.')};
A['trip.start']=async el=>{need('deliveries',2);const t=DB.get('deliveries',el.dataset.id);if(!await confirmBox('Start trip '+t.no+'? Stock for its orders will be taken out of the warehouse and customers will be told their order is on the way.','Start trip'))return;
  const orders=t.stops.map(s=>DB.get('orders',s.orderId)).filter(o=>o&&o.status!=='cancelled');
  const needs={};for(const o of orders)if(!o.stockPosted)for(const l of o.lines){const k=l.productId+'|'+o.warehouseId;needs[k]=(needs[k]||0)+l.qty}

  t.status='in_transit';t.startedAt=Date.now();DB.put('deliveries',t,{note:t.no+' started'});for(const o of orders)setOrderStatus(o,'out_for_delivery');refresh();toast('Trip started.','good')};

function storeBot(q){const d=STORE.data;if(!d)return 'The store is still loading.';const s=q.toLowerCase(),st=d.store,c=d.company;
