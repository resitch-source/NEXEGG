  else if(sub==='rules')v.innerHTML=formCard('ruf',RULES_F(),{...c.tax,...c.ai,...c.security,...(c.market||{}),currency:c.locale.currency,sizes:c.eggSizes.join(', '),packs:c.packTypes.map(p=>p.name+' = '+p.eggs).join('\n'),...Object.fromEntries(Object.entries(c.numbering).map(([k,x])=>['no_'+k,x]))},'adm.rules','Save business rules');
  else if(sub==='users')listPage(v,{table:'users',mod:'admin',noun:'users',one:'user',sort:'name',noImport:true,defaults:()=>({active:true,role:'role_sales'}),
    fields:r=>[{k:'name',label:'Full name',req:1},{k:'username',label:'Username',req:1,ro:!!r},{k:'role',label:'Role',type:'select',req:1,options:()=>DB.all('roles').map(x=>[x.id,x.name])},{k:'warehouseId',label:'Home warehouse',type:'select',options:whOptions},{k:'email',label:'Email',type:'email'},{k:'phone',label:'Mobile',type:'tel'},{k:'pw',label:r?'New password (leave empty to keep)':'Password',type:'password',req:!r,hint:'At least 8 characters with letters and numbers.'},{k:'active',label:'Can sign in',type:'checkbox',def:true}],
    beforeSave:async(r,isNew,vv)=>{need('admin',3);if(!/^[a-z0-9._-]{3,30}$/i.test(r.username))throw new Error('Username: 3 to 30 letters, numbers, dot, dash or underscore.');if(isNew&&DB.all('users').some(u=>u.username.toLowerCase()===r.username.toLowerCase()))throw new Error('That username is taken.');
      if(r.id===S.user.id&&(!r.active||r.role!==S.user.role))throw new Error('You cannot change your own role or switch yourself off.');const pw=vv.pw;delete r.pw;if(!r.id)r.id=uid('us_');
      if(pw){const w=pwCheck(pw);if(w)throw new Error(w);const salt=newSalt(),hash=await pbkdf2(pw,salt);if(cloud()){if(isNew){DB.put('users',{...r},{silent:true});await syncNow()}await api('setpass',{userId:r.id,username:r.username,salt,iter:PBKDF2_ITER,hash})}else{r.salt=salt;r.iter=PBKDF2_ITER;r.hash=hash}}},
    canDelete:r=>r.id===S.user.id?'You cannot delete your own account.':'',
    cols:[{k:'name',label:'Name'},{k:'username',label:'Username'},{k:'role',label:'Role',fmt:v=>esc(DB.name('roles',v))},{k:'warehouseId',label:'Warehouse',fmt:v=>esc(DB.name('warehouses',v))},{k:'active',label:'Status',fmt:v=>v!==false?'<span class="badge g">Active</span>':'<span class="badge r">Off</span>'}]});
  else if(sub==='roles'){v.innerHTML=`<p class="muted" style="margin-top:0">Each role gets a level per module. The cloud backend enforces the same levels, so they cannot be bypassed from a browser.</p><div class="grid gauto" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${DB.all('roles').map(r=>`<div class="card"><div class="row between"><h3>${esc(r.name)}</h3>${full?`<button class="btn sm" data-act="adm.role" data-id="${r.id}">${I('edit')}Edit</button>`:''}</div><div class="small" style="margin-top:8px">${MODULES.map(([k,l])=>`<div class="tot"><span>${l}</span><span class="${r.perms[k]?'':'muted'}">${LEVELS[r.perms[k]||0]}</span></div>`).join('')}</div></div>`).join('')}</div>${full?`<button class="btn pri" style="margin-top:14px" data-act="adm.role">${I('plus')}Add a role</button>`:''}`}
  else if(sub==='modules'){v.innerHTML=`<div class="grid g2" style="align-items:start"><div class="card"><h3>Modules in use</h3><p class="small muted">Switch off what this business does not need. Hidden modules keep their data.</p><form id="modf" class="grid">${MODULES.filter(m=>!['dashboard','admin'].includes(m[0])).map(([k,l])=>`<label class="chk"><input type="checkbox" name="${k}"${c.modules[k]!==false?' checked':''}>${l}</label>`).join('')}</form>${full?'<button class="btn pri" style="margin-top:12px" data-act="adm.modules">Save modules</button>':''}</div>
    <div class="card"><h3>Your own fields</h3><p class="small muted">Add extra fields to a form. One per line as: <code>Label</code> or <code>Label | number</code> (types: text, number, date, checkbox).</p><form id="cff" class="grid">${[['products','Items'],['customers','Customers'],['suppliers','Suppliers'],['equipment','Equipment']].map(([t,l])=>`<label class="f">${l}<textarea name="${t}">${esc((c.customFields?.[t]||[]).map(f=>f.label+(f.type&&f.type!=='text'?' | '+f.type:'')).join('\n'))}</textarea></label>`).join('')}</form>${full?'<button class="btn pri" style="margin-top:12px" data-act="adm.fields">Save fields</button>':''}</div></div>`}
  else if(sub==='data'){const n=dirtyCount();const counts=TABLES.filter(t=>!['audit','media','settings'].includes(t)).map(t=>[t,DB.all(t).length]).filter(x=>x[1]);
    v.innerHTML=`<div class="grid g2" style="align-items:start;margin-bottom:14px"><div class="card"><h3>Where your data lives</h3>${cloud()?`<p><span class="badge g">Google Sheets cloud</span></p><p class="small">Backend: <code>${esc(apiUrl())}</code></p><p class="small">Last sync: ${KV.lastSync?fdt(KV.lastSync):'never'} · ${n} change(s) waiting${_syncErr?` · <span class="err">${esc(_syncErr)}</span>`:''}</p><div class="row"><button class="btn pri" data-act="sync.now">${I('sync')}Sync now</button>${full?`<button class="btn" data-act="data.resync">Download everything again</button>`:''}</div>`
      :`<p><span class="badge b">Local database on this device</span></p><p class="small muted">Data is kept in this browser's IndexedDB. It survives restarts, but clearing browser data erases it, so keep Excel backups. Last backup: ${KV.lastBackup?fdt(KV.lastBackup):'none yet'}.</p>${full?`<button class="btn" data-act="data.tocloud">Move this database to Google Sheets</button>`:''}`}</div>
     <div class="card"><h3>Records on this device</h3><div class="small">${counts.map(([t,x])=>`<div class="tot"><span>${esc(cap(t))}</span><span class="num">${fn(x)}</span></div>`).join('')}</div></div></div>${dataFilesHtml()}
     ${full?`<div class="card" style="margin-top:14px;border-color:var(--red)"><h3>Clear transactions</h3><p class="small muted">Removes orders, payments, deliveries, stock movements, lots, purchase orders, receipts, counts, expenses and messages, including sample data. Items, customers, suppliers, equipment, users and settings stay.</p><button class="btn dan" data-act="data.clear">Clear all transactions</button></div>`:''}`}
  else listPage(v,{table:'audit',mod:'admin',noun:'entries',readonly:true,sort:'ts',dir:-1,search:['user','action','table','detail'],cols:[{k:'ts',label:'When',fmt:v=>fdt(v)},{k:'user',label:'User'},{k:'action',label:'Action',fmt:v=>esc(cap(v))},{k:'table',label:'Area',fmt:v=>esc(cap(v))},{k:'detail',label:'Detail'}]});
}};
const COMPANY_F=[{k:'name',label:'Business name',req:1},{k:'tagline',label:'Tagline'},{k:'address',label:'Address',full:1},{k:'phone',label:'Phone',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'tin',label:'TIN'},{k:'brand',label:'Brand colour',type:'color',def:'#17695A'},{k:'logo',label:'Company logo',type:'image'}];
const RULES_F=()=>[{type:'sep',label:'Tax and pricing'},{k:'currency',label:'Currency symbol',req:1},{k:'vatRate',label:'VAT rate, percent',type:'number',min:0},{k:'pricesIncludeVat',label:'Prices already include VAT',type:'checkbox'},{k:'scRate',label:'Senior citizen and PWD discount, percent',type:'number',min:0,hint:'5% is the usual special discount on basic necessities such as eggs. Confirm the current rule with your accountant.'},{k:'allowNegativeStock',label:'Allow selling more than the recorded stock',type:'checkbox'},
  {type:'sep',label:'Eggs'},{k:'sizes',label:'Egg sizes, smallest to largest, separated by commas',full:1},{k:'packs',label:'Pack types, one per line as Name = eggs',type:'textarea'},
  {type:'sep',label:'Document numbers (prefixes)'},{k:'no_order',label:'Sales order'},{k:'no_po',label:'Purchase order'},{k:'no_grn',label:'Goods received'},{k:'no_trip',label:'Delivery trip'},{k:'no_count',label:'Stock count'},
  {type:'sep',label:'CYRA AI'},{k:'leadDays',label:'Supplier lead time, days',type:'number',min:0},{k:'reviewDays',label:'Days between purchase reviews',type:'number',min:1},{k:'z',label:'Safety factor (1.65 covers about 95% of days)',type:'number',min:0},{k:'alpha',label:'Forecast level smoothing (0 to 1)',type:'number',min:0.01},{k:'beta',label:'Forecast trend smoothing (0 to 1)',type:'number',min:0.01},
  {type:'sep',label:'Market pricing'},{k:'targetBelow',label:'Aim this many percent below the market median',type:'number'},{k:'minMargin',label:'Never go below cost plus this percent',type:'number',min:0},{k:'windowDays',label:'Days of price readings to use',type:'number',min:1},
  {type:'sep',label:'Security'},{k:'idleMinutes',label:'Sign out after idle minutes',type:'number',min:1},{k:'maxAttempts',label:'Wrong passwords before a 15-minute lock',type:'number',min:3}];
A['adm.company']=()=>{need('admin',3);const v=readForm($('#cof2'),COMPANY_F);cfgSave({company:{...CFG().company,...v}});$('#app')?.remove();$('#root').innerHTML='';render();toast('Company details saved.','good')};
A['adm.rules']=()=>{need('admin',3);const v=readForm($('#ruf'),RULES_F());const c=CFG();const sizes=v.sizes.split(',').map(s=>s.trim()).filter(Boolean);const packs=v.packs.split('\n').map(l=>l.split('=')).filter(a=>a[0].trim()).map(a=>({name:a[0].trim(),eggs:num(a[1])}));if(!sizes.length)throw new Error('List at least one egg size.');if(v.alpha>1||v.beta>1)throw new Error('Smoothing values must be between 0 and 1.');
  cfgSave({tax:{...c.tax,vatRate:v.vatRate,pricesIncludeVat:v.pricesIncludeVat,scRate:v.scRate,allowNegativeStock:v.allowNegativeStock},locale:{...c.locale,currency:v.currency},eggSizes:sizes,packTypes:packs.length?packs:c.packTypes,numbering:{order:v.no_order||'SO',po:v.no_po||'PO',grn:v.no_grn||'GRN',trip:v.no_trip||'DR',count:v.no_count||'CNT'},ai:{leadDays:v.leadDays,reviewDays:v.reviewDays,z:v.z,alpha:v.alpha,beta:v.beta},security:{idleMinutes:v.idleMinutes,maxAttempts:v.maxAttempts},market:{targetBelow:v.targetBelow,minMargin:v.minMargin,windowDays:v.windowDays}});_planCache.k='';toast('Business rules saved.','good')};
A['adm.modules']=()=>{need('admin',3);const f=$('#modf');const m={...CFG().modules};for(const e of $$('input',f))m[e.name]=e.checked;cfgSave({modules:m});$('#app')?.remove();$('#root').innerHTML='';render();toast('Modules saved.','good')};
A['adm.fields']=()=>{need('admin',3);const f=$('#cff');const cf={};for(const e of $$('textarea',f))cf[e.name]=e.value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]).map(a=>({key:a[0].toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,24),label:a[0],type:['number','date','checkbox'].includes(a[1])?a[1]:'text'}));cfgSave({customFields:cf});toast('Custom fields saved. They appear at the bottom of each form.','good')};
A['adm.role']=async el=>{need('admin',3);const r=el.dataset.id?DB.get('roles',el.dataset.id):{id:uid('role_'),name:'',perms:{}};if(r.id==='role_admin')throw new Error('The Administrator role always has full control and cannot be edited.');
  const m=modal({title:r.name?'Edit role':'New role',cls:'narrow',body:`<label class="f">Role name<input name="name" value="${esc(r.name)}"></label><div class="perm" style="margin-top:14px">${MODULES.map(([k,l])=>`<span>${l}</span><select data-m="${k}">${LEVELS.map((x,i)=>`<option value="${i}"${(r.perms[k]||0)===i?' selected':''}>${x}</option>`).join('')}</select>`).join('')}</div><div class="err"></div>`,foot:`${el.dataset.id&&!DEF_ROLES.some(d=>d.id===r.id)?'<button class="btn dan" data-del>Delete role</button>':''}<button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Save role</button>`});
  $('[data-ok]',m.el).onclick=()=>{const name=$('[name=name]',m.el).value.trim();if(!name){$('.err',m.el).textContent='Give the role a name.';return}r.name=name;r.perms={};for(const s of $$('[data-m]',m.el))if(+s.value)r.perms[s.dataset.m]=+s.value;DB.put('roles',r);m.close();refresh()};
  const d=$('[data-del]',m.el);if(d)d.onclick=()=>{if(DB.all('users').some(u=>u.role===r.id)){$('.err',m.el).textContent='Users still have this role. Move them first.';return}DB.del('roles',r.id);m.close();refresh()}};
A['data.resync']=async()=>{need('admin',3);if(dirtyCount()&&!await confirmBox('There are unsynced changes on this device. They will be pushed first, then everything is downloaded again.','Continue'))return;await kvSet('since',0);await syncNow(true);refresh()};
A['data.clear']=async()=>{need('admin',3);if(!await confirmBox('Clear ALL transactions? This cannot be undone. Export an Excel backup first if you are unsure.','Clear transactions',true))return;const ts=['orders','payments','deliveries','movements','batches','pos','receipts','counts','expenses','notifications','maintenance','market','prospects','supplysrc'];
  if(cloud()){for(const t of ts){const recs=DB.all(t);for(const r of recs){r._d=1;r._u=Date.now();r._s=1}await idbPut(t,recs)}schedSync()}else for(const t of ts){M[t].clear();await idbClear(t)}_stk=null;_planCache.k='';_riskCache.k='';audit('clear','all','','Transactions cleared');refresh();toast('Transactions cleared.','good')};
A['data.tocloud']=async()=>{need('admin',3);await formModal({title:'Move this database to Google Sheets',saveLabel:'Move to the cloud',pre:`<p class="muted" style="margin-top:0">Deploy the Apps Script backend on a new, empty Google Sheet first and run its setup function to get the setup key. Everything on this device is then uploaded. Other users will need new passwords set by you afterwards.</p>`,fields:[{k:'url',label:'Apps Script web app address',type:'url',req:1,full:1},{k:'key',label:'Setup key',req:1,full:1},{k:'pw',label:'Your current password (it becomes your cloud password)',type:'password',req:1,full:1}],
  onSave:async v=>{const u=DB.get('users',S.user.id);if(await pbkdf2(v.pw,u.salt,u.iter||PBKDF2_ITER)!==u.hash)throw new Error('That password is wrong.');const ping=await api('ping',{},v.url);if(!ping.app)throw new Error('That address did not answer like a NEXEGG backend.');const salt=newSalt();
    await api('bootstrap',{setupKey:v.key,userId:u.id,username:u.username,name:u.name,company:CFG().company.name,salt,iter:PBKDF2_ITER,hash:await pbkdf2(v.pw,salt),settings:CFG(),roles:DB.all('roles')},v.url);
    await kvSet('api',v.url);await kvSet('mode','cloud');await kvSet('since',0);for(const t of TABLES){const recs=[...M[t].values()];for(const r of recs){r._s=1;if(t==='users'){delete r.hash;delete r.salt;delete r.iter}}if(recs.length)await idbPut(t,recs)}
    await loginCloud(u.username,v.pw);await syncNow(true);$('#app')?.remove();$('#root').innerHTML='';render();toast('This business now runs on Google Sheets.','good')}})};

/* ================= boot ================= */
function fatal(title,msg){window.__nxReady=true;const r=$('#root');if(!r)return;r.innerHTML=`<div class="empty" style="padding-top:22vh;max-width:560px;margin:0 auto"><h2>${esc(title)}</h2><p style="white-space:pre-wrap">${esc(msg)}</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" onclick="location.reload()">Reload</button><button class="btn" data-act="boot.unsw">Clear cached app files</button><button class="btn dan" data-act="boot.reset">Reset local database</button></div><p class="small muted" style="margin-top:14px">${esc(APP.name)} v${APP.ver} · ${esc(navigator.userAgent.slice(0,80))}</p></div>`}
A['boot.unsw']=async()=>{try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()};
A['boot.reset']=async()=>{if(!confirm('Delete the local database on this device? Data synced to Google Sheets is safe; local-only data is lost unless you have an Excel backup. Continue?'))return;try{idb&&idb.close()}catch(e){}await new Promise(r=>{const q=indexedDB.deleteDatabase('nexegg');q.onsuccess=q.onerror=q.onblocked=()=>r()});try{localStorage.clear();sessionStorage.clear()}catch(e){}location.reload()};
window.addEventListener('error',e=>{if(!$('#app')&&!$('.auth'))fatal('NEXEGG could not start',String(e.message||e.error||'Unknown error'))});
window.addEventListener('unhandledrejection',e=>{if(!$('#app')&&!$('.auth'))fatal('NEXEGG could not start',String(e.reason&&e.reason.message||e.reason||'Unknown error'))});
function boot2(){$('#app')?.remove();$('#chat')?.remove();$('#root').innerHTML='';render()}
async function boot(){
  $('#root').innerHTML='<div class="empty" style="padding-top:30vh">Opening NEXEGG…</div>';
  const watchdog=setTimeout(()=>{if(!$('#app')&&!$('.auth')&&!$('.store-hd')&&!/Waiting for another/.test($('#root').innerHTML))fatal('NEXEGG is taking too long to start','The local database did not open within 20 seconds. Close other NEXEGG windows and the installed app, then reload. If it keeps happening, use the buttons below.')},20000);
  try{for(let attempt=1;;attempt++){try{await loadAll();break}catch(e){if(e&&e.code==='blocked'&&attempt<=60){$('#root').innerHTML=`<div class="empty" style="padding-top:22vh;max-width:560px;margin:0 auto"><h2>Waiting for another NEXEGG window to close</h2><p>This page needs to update the local database, but another browser tab or window with NEXEGG open is holding it. Close that other tab (look for tabs named NEXEGG, including an older one showing an error, or the installed app) and this page will continue by itself.</p><p class="muted small">Checking again every few seconds… attempt ${attempt}</p><div class="row" style="justify-content:center"><button class="btn pri" onclick="location.reload()">Reload</button><button class="btn dan" data-act="boot.reset">Reset local database</button></div></div>`;await sleep(3000);continue}throw e}}}
  catch(e){clearTimeout(watchdog);fatal('The local database could not be opened',(e&&e.message||String(e))+'\n\nIf you are in private browsing mode, leave it or allow site data for this page.');return}
  clearTimeout(watchdog);
  if(!KV.dev)await kvSet('dev',uid('dev_'));
  document.documentElement.dataset.theme=KV.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const s=M.settings.get('main');if(s)deepDefaults(s,DEF_SETTINGS);
  try{const ss=JSON.parse(sessionStorage.getItem('nx_s')||'null');if(ss&&ss.user&&KV.mode){S.user=ss.user;S.role=ss.role;S.token=ss.token||KV.token||null;if(!cloud()){const u=DB.get('users',ss.user.id);if(!u||u.active===false){S.user=null}else{S.user=u;S.role=DB.get('roles',u.role)||ss.role}}}}catch(e){}
  applyBrand();try{render()}catch(e){fatal('NEXEGG could not draw the first screen',e.message||String(e));return}
  window.__nxReady=true;
  if(S.user&&cloud())syncNow().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
